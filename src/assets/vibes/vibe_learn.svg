<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Open Book with Idea Lightbulb (Learn Vibe) -->
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="40" fill="#EBF3FF" stroke="#191919" stroke-width="3"/>
  
  <!-- Glowing Lightbulb -->
  <path d="M50 18 C40 18 34 26 34 35 C34 42 38 46 42 50 L42 56 L58 56 L58 50 C62 46 66 42 66 35 C66 26 60 18 50 18 Z" fill="#FFD43B" stroke="#191919" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Filament -->
  <path d="M47 36 L50 30 L53 36" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Base threads -->
  <line x1="44" y1="59" x2="56" y2="59" stroke="#191919" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Light Rays -->
  <line x1="50" y1="10" x2="50" y2="14" stroke="#4D7CFE" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="22" x2="32" y2="25" stroke="#4D7CFE" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="22" x2="68" y2="25" stroke="#4D7CFE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Open Book at base -->
  <g transform="translate(24, 60)">
    <path d="M2 14 Q14 6 26 14 Q38 6 50 14 L48 24 Q37 16 26 22 Q15 16 4 24 Z" fill="#FFFFFF" stroke="#191919" stroke-width="2.4"/>
    <line x1="26" y1="14" x2="26" y2="22" stroke="#191919" stroke-width="1.8"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M80 34 L82 38 L86 40 L82 42 L80 46 L78 42 L74 40 L78 38 Z" fill="#FF72B6" stroke="#191919" stroke-width="1.2"/>
  <circle cx="20" cy="42" r="2.5" fill="#4D7CFE"/>
</svg>
