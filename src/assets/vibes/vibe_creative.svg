<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Die-cut sticker background -->
  <!-- Artist Wooden Palette with Paint & Brush -->
  <path d="M50 15 C28 15 12 30 12 52 C12 74 30 85 52 85 C62 85 68 78 68 70 C68 65 64 62 64 57 C64 50 72 45 80 45 C86 45 88 40 88 35 C88 22 70 15 50 15 Z" fill="#FFE8F3" stroke="#191919" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Thumb Hole -->
  <ellipse cx="28" cy="62" rx="6" ry="8" fill="#FFFFFF" stroke="#191919" stroke-width="2.5"/>

  <!-- Paint Swatches on Palette -->
  <circle cx="30" cy="32" r="6" fill="#FF72B6" stroke="#191919" stroke-width="1.8"/>
  <circle cx="48" cy="25" r="6" fill="#FFD43B" stroke="#191919" stroke-width="1.8"/>
  <circle cx="68" cy="28" r="6" fill="#4D7CFE" stroke="#191919" stroke-width="1.8"/>
  <circle cx="76" cy="42" r="5" fill="#5BCB77" stroke="#191919" stroke-width="1.8"/>
  <circle cx="56" cy="74" r="5" fill="#9B72FF" stroke="#191919" stroke-width="1.8"/>

  <!-- Paintbrush across the palette -->
  <g transform="translate(42, 38) rotate(35)">
    <rect x="0" y="0" width="45" height="5" rx="2" fill="#D98A5B" stroke="#191919" stroke-width="1.6"/>
    <rect x="36" y="0" width="8" height="5" fill="#C0C0C0" stroke="#191919" stroke-width="1.2"/>
    <path d="M44 0 C49 0 54 2.5 54 2.5 C54 2.5 49 5 44 5 Z" fill="#FF72B6" stroke="#191919" stroke-width="1.2"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M84 14 L86 18 L90 20 L86 22 L84 26 L82 22 L78 20 L82 18 Z" fill="#FFD43B" stroke="#191919" stroke-width="1.2"/>
  <circle cx="16" cy="22" r="2.5" fill="#FF72B6"/>
</svg>
