<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Mountain Peaks & Pine Tree & Smiling Campfire (Outdoors Vibe) -->
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="40" fill="#EFFCF4" stroke="#191919" stroke-width="3"/>
  
  <!-- Twin Mountain Peaks -->
  <!-- Left Mountain -->
  <polygon points="16,68 38,30 60,68" fill="#5BCB77" stroke="#191919" stroke-width="2.6" stroke-linejoin="round"/>
  <polygon points="38,30 45,42 41,45 38,41 35,45 31,42" fill="#FFFFFF" stroke="#191919" stroke-width="1.8"/>
  
  <!-- Right Mountain (taller) -->
  <polygon points="40,68 65,22 90,68" fill="#3D7C45" stroke="#191919" stroke-width="2.6" stroke-linejoin="round"/>
  <polygon points="65,22 74,36 70,39 65,35 60,39 56,36" fill="#FFFFFF" stroke="#191919" stroke-width="1.8"/>

  <!-- Pine Tree in foreground -->
  <g transform="translate(18, 52)">
    <polygon points="12,0 4,14 8,14 2,26 22,26 16,14 20,14" fill="#2D6035" stroke="#191919" stroke-width="2" stroke-linejoin="round"/>
    <rect x="10" y="26" width="4" height="6" fill="#D98A5B" stroke="#191919" stroke-width="1.6"/>
  </g>

  <!-- Cute Campfire with Smiling Flame -->
  <g transform="translate(56, 56)">
    <!-- Crossing logs -->
    <line x1="2" y1="18" x2="22" y2="10" stroke="#D98A5B" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="2" y1="10" x2="22" y2="18" stroke="#D98A5B" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Flame -->
    <path d="M12 2 C18 6 20 12 18 16 C16 19 8 19 6 16 C4 12 6 6 12 2 Z" fill="#FF914D" stroke="#191919" stroke-width="2"/>
    <path d="M12 7 C15 10 16 13 15 15 C14 17 10 17 9 15 C8 13 9 10 12 7 Z" fill="#FFD43B"/>
  </g>

  <!-- Sun & Birds in sky -->
  <circle cx="28" cy="22" r="7" fill="#FFD43B" stroke="#191919" stroke-width="2"/>
  <path d="M78 14 Q81 10 84 14 Q87 10 90 14" stroke="#191919" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
