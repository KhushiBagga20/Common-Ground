<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Lightning Bolt & Running Sneaker (Active Vibe) -->
  <!-- Energetic Background Burst -->
  <polygon points="50,6 62,32 90,36 68,54 75,82 50,66 25,82 32,54 10,36 38,32" fill="#FFE8D6" stroke="#191919" stroke-width="3"/>
  
  <!-- Sporty Sneaker with motion lines -->
  <g transform="translate(25, 34)">
    <path d="M4 26 Q12 12 30 14 Q46 16 52 26 C52 34 32 38 4 34 Z" fill="#FF914D" stroke="#191919" stroke-width="2.6"/>
    <!-- Sole -->
    <path d="M2 32 Q26 38 52 30" stroke="#191919" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Stripes -->
    <path d="M20 15 L14 26" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M26 16 L20 27" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Laces -->
    <path d="M30 16 Q36 22 42 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Lightning Bolt Doodle -->
  <polygon points="58,16 46,38 56,38 44,64 70,36 58,36" fill="#FFD43B" stroke="#191919" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Speed Motion Trails -->
  <path d="M12 60 H26" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M16 68 H32" stroke="#FF914D" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 76 H22" stroke="#FFD43B" stroke-width="2.5" stroke-linecap="round"/>
</svg>
