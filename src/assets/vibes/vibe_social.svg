  <circle cx="36" cy="32" r="2" fill="#191919"/>
  <circle cx="48" cy="32" r="2" fill="#191919"/>
  <path d="M38 38 Q42 43 46 38" stroke="#191919" stroke-width="2" stroke-linecap="round" fill="none"/>
  
