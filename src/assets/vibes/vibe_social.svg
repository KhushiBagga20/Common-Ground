    <path d="M9.5 10 L21.5 7" stroke="#191919" stroke-width="1.8"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M78 16 L80 20 L84 22 L80 24 L78 28 L76 24 L72 22 L76 20 Z" fill="#FFD43B" stroke="#191919" stroke-width="1.2"/>
