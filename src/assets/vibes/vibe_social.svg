  <!-- Right Pink Bubble -->
  <path d="M48 45 C48 38 60 38 70 38 C80 38 88 44 88 52 C88 60 80 66 70 66 L68 76 L58 66 C50 66 48 60 48 52 Z" fill="#FFE8F3" stroke="#191919" stroke-width="2.5" stroke-linejoin="round"/>

