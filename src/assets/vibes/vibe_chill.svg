<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Die-cut white background sticker border -->
  <circle cx="50" cy="50" r="45" fill="#FFFCEB" stroke="#191919" stroke-width="3"/>
  
  <!-- Warm Smiling Sun Body -->
  <circle cx="50" cy="50" r="32" fill="#FFD43B" stroke="#191919" stroke-width="2.5"/>

  <!-- Cheerful Rounded Sun Rays -->
  <!-- Top, Bottom, Left, Right -->
  <path d="M50 8 V16" stroke="#191919" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 84 V92" stroke="#191919" stroke-width="3" stroke-linecap="round"/>
  <path d="M8 50 H16" stroke="#191919" stroke-width="3" stroke-linecap="round"/>
  <path d="M84 50 H92" stroke="#191919" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Diagonals -->
  <path d="M20 20 L26 26" stroke="#191919" stroke-width="3" stroke-linecap="round"/>
  <path d="M74 74 L80 80" stroke="#191919" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 80 L26 74" stroke="#191919" stroke-width="3" stroke-linecap="round"/>
  <path d="M74 26 L80 20" stroke="#191919" stroke-width="3" stroke-linecap="round"/>

  <!-- Proper, Cool Wayfarer Sunglasses -->
  <!-- Connecting Browline & Bridge -->
  <path d="M27 41 C38 40 46 41 50 43 C54 41 62 40 73 41" stroke="#191919" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Left Sunglass Lens -->
  <rect x="29" y="42" width="18" height="15" rx="5" fill="#191919" stroke="#191919" stroke-width="2"/>
  <!-- Left Lens Glint -->
  <line x1="33" y1="45" x2="38" y2="52" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Right Sunglass Lens -->
  <rect x="53" y="42" width="18" height="15" rx="5" fill="#191919" stroke="#191919" stroke-width="2"/>
  <!-- Right Lens Glint -->
  <line x1="57" y1="45" x2="62" y2="52" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cute Big Smile with Tongue / Sparkle -->
  <path d="M42 63 Q50 72 58 63" stroke="#191919" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Rosy Cheeks -->
  <ellipse cx="32" cy="61" rx="4" ry="2.5" fill="#FF72B6" opacity="0.65"/>
  <ellipse cx="68" cy="61" rx="4" ry="2.5" fill="#FF72B6" opacity="0.65"/>

  <!-- Tiny Sparkles -->
  <path d="M78 12 L80 15 L83 16 L80 17 L78 20 L76 17 L73 16 L76 15 Z" fill="#FF72B6"/>
</svg>
