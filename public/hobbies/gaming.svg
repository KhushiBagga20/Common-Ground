  <rect x="205" y="248" width="14" height="6" rx="3" fill="#111"/>
  
  <!-- Sparkles and stars -->
  <path d="M80 170 L85 185 L100 185 L88 195 L92 210 L80 202 L68 210 L72 195 L60 185 L75 185Z" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <path d="M320 170 L324 182 L336 182 L327 190 L330 202 L320 195 L310 202 L313 190 L304 182 L316 182Z" fill="#FF72B6" stroke="#111" stroke-width="2"/>
  <path d="M340 380 L343 390 L353 390 L345 396 L348 406 L340 400 L332 406 L335 396 L327 390 L337 390Z" fill="#4D7CFE" stroke="#111" stroke-width="2"/>
