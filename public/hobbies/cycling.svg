<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" fill="none">
  <rect width="400" height="533" rx="20" fill="#F7F6F2"/>
  
  <!-- Bicycle frame -->
  <!-- Rear wheel -->
  <circle cx="130" cy="330" r="70" fill="none" stroke="#111" stroke-width="5"/>
  <circle cx="130" cy="330" r="60" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="130" cy="330" r="8" fill="#5BCB77" stroke="#111" stroke-width="3"/>
  
  <!-- Front wheel -->
  <circle cx="290" cy="330" r="70" fill="none" stroke="#111" stroke-width="5"/>
  <circle cx="290" cy="330" r="60" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="290" cy="330" r="8" fill="#5BCB77" stroke="#111" stroke-width="3"/>
  
  <!-- Frame -->
  <line x1="130" y1="330" x2="200" y2="240" stroke="#5BCB77" stroke-width="6" stroke-linecap="round"/>
  <line x1="130" y1="330" x2="220" y2="320" stroke="#5BCB77" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="240" x2="220" y2="320" stroke="#5BCB77" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="320" x2="290" y2="330" stroke="#5BCB77" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Handlebar -->
  <line x1="290" y1="330" x2="280" y2="230" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M265 225 Q280 220, 295 230" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Seat -->
  <line x1="200" y1="240" x2="195" y2="205" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="195" cy="200" rx="22" ry="8" fill="#111" stroke="#111" stroke-width="2"/>
  
  <!-- Pedal -->
  <circle cx="220" cy="320" r="12" fill="#FFD43B" stroke="#111" stroke-width="3"/>
  <line x1="220" y1="310" x2="228" y2="340" stroke="#111" stroke-width="3"/>
  
  <!-- Speed lines -->
  <line x1="50" y1="260" x2="90" y2="260" stroke="#5BCB77" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="40" y1="290" x2="70" y2="290" stroke="#5BCB77" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="45" y1="320" x2="60" y2="320" stroke="#5BCB77" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Sparkles -->
  <path d="M160 120 L165 135 L180 135 L168 145 L172 160 L160 152 L148 160 L152 145 L140 135 L155 135Z" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <path d="M320 140 L324 152 L336 152 L327 160 L330 172 L320 165 L310 172 L313 160 L304 152 L316 152Z" fill="#FF72B6" stroke="#111" stroke-width="2"/>
  
  <!-- Hearts -->
  <path d="M80 160 C80 155, 88 155, 88 160 C88 165, 80 170, 80 170 C80 170, 72 165, 72 160 C72 155, 80 155, 80 160Z" fill="#FF5C5C" stroke="#111" stroke-width="2"/>
  
  <!-- Road line -->
  <path d="M30 430 Q200 410, 370 430" stroke="#111" stroke-width="2" fill="none" stroke-dasharray="10 8"/>
</svg>
