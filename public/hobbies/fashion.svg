<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" fill="none">
  <rect width="400" height="533" rx="20" fill="#F7F6F2"/>
  
  <!-- Dress form / mannequin -->
  <path d="M160 150 Q160 120, 200 110 Q240 120, 240 150 L245 300 Q240 310, 200 315 Q160 310, 155 300Z" fill="#FF72B6" stroke="#111" stroke-width="5"/>
  
  <!-- Dress details -->
  <path d="M165 180 Q200 175, 235 180" stroke="#111" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  <path d="M160 230 Q200 225, 240 230" stroke="#111" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
  
  <!-- Neckline -->
  <path d="M170 150 Q200 160, 230 150" stroke="#111" stroke-width="3" fill="none"/>
  
  <!-- Stand -->
  <line x1="200" y1="315" x2="200" y2="400" stroke="#111" stroke-width="5"/>
  <ellipse cx="200" cy="405" rx="50" ry="12" fill="#111" stroke="#111" stroke-width="2"/>
  
  <!-- Scissors -->
  <g transform="translate(300, 200) rotate(30)">
    <ellipse cx="-10" cy="0" rx="15" ry="8" fill="none" stroke="#111" stroke-width="3"/>
    <ellipse cx="10" cy="0" rx="15" ry="8" fill="none" stroke="#111" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#6F6F6A" stroke-width="3"/>
    <line x1="0" y1="0" x2="15" y2="-48" stroke="#6F6F6A" stroke-width="3"/>
  </g>
  
  <!-- Thread spool -->
  <rect x="70" y="300" width="30" height="40" rx="4" fill="#9B72FF" stroke="#111" stroke-width="3"/>
  <rect x="65" y="296" width="40" height="8" rx="3" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <rect x="65" y="336" width="40" height="8" rx="3" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  
  <!-- Fabric swatches -->
  <rect x="80" y="420" width="40" height="40" rx="4" fill="#FFD43B" stroke="#111" stroke-width="2" transform="rotate(-10, 100, 440)"/>
  <rect x="120" y="425" width="40" height="40" rx="4" fill="#4D7CFE" stroke="#111" stroke-width="2" transform="rotate(5, 140, 445)"/>
  <rect x="160" y="420" width="40" height="40" rx="4" fill="#FF72B6" stroke="#111" stroke-width="2" transform="rotate(-3, 180, 440)"/>
  
  <!-- Sparkles -->
  <path d="M80 130 L85 145 L100 145 L88 155 L92 170 L80 162 L68 170 L72 155 L60 145 L75 145Z" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <path d="M320 350 L323 358 L331 358 L325 363 L327 371 L320 366 L313 371 L315 363 L309 358 L317 358Z" fill="#5BCB77" stroke="#111" stroke-width="2"/>
  
  <!-- Hearts -->
  <path d="M310 130 C310 125, 318 125, 318 130 C318 135, 310 140, 310 140 C310 140, 302 135, 302 130 C302 125, 310 125, 310 130Z" fill="#FF5C5C" stroke="#111" stroke-width="2"/>
</svg>
