  <!-- Sparkles -->
  <path d="M320 160 L325 175 L340 175 L328 185 L332 200 L320 192 L308 200 L312 185 L300 175 L315 175Z" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <path d="M80 155 L84 167 L96 167 L87 175 L90 187 L80 180 L70 187 L73 175 L64 167 L76 167Z" fill="#FF72B6" stroke="#111" stroke-width="2"/>
  <path d="M340 330 L343 340 L353 340 L345 346 L348 356 L340 350 L332 356 L335 346 L327 340 L337 340Z" fill="#5BCB77" stroke="#111" stroke-width="2"/>
  
