  <rect x="115" y="175" width="60" height="35" rx="10" fill="#FFD43B" stroke="#111" stroke-width="4"/>
  
  <!-- Lens -->
  <circle cx="200" cy="275" r="55" fill="#F7F6F2" stroke="#111" stroke-width="5"/>
  <circle cx="200" cy="275" r="38" fill="#111" stroke="#111" stroke-width="3"/>
  <circle cx="200" cy="275" r="22" fill="#4D7CFE"/>
  <circle cx="210" cy="265" r="8" fill="#fff" opacity="0.7"/>
  
  <!-- Flash -->
  <rect x="260" y="210" width="25" height="18" rx="4" fill="#FFD43B" stroke="#111" stroke-width="3"/>
  
