  <circle cx="340" cy="250" r="8" fill="none" stroke="#FF72B6" stroke-width="3" stroke-dasharray="3 3"/>
  
  <!-- Little hearts -->
  <path d="M320 390 C320 385, 328 385, 328 390 C328 395, 320 400, 320 400 C320 400, 312 395, 312 390 C312 385, 320 385, 320 390Z" fill="#FF5C5C" stroke="#111" stroke-width="2"/>
