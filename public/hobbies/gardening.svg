<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" fill="none">
  <rect width="400" height="533" rx="20" fill="#F7F6F2"/>
  
  <!-- Flower pot -->
  <path d="M140 380 L130 460 L270 460 L260 380Z" fill="#FF914D" stroke="#111" stroke-width="4"/>
  <rect x="125" y="370" width="150" height="20" rx="6" fill="#FF914D" stroke="#111" stroke-width="4"/>
  <ellipse cx="200" cy="465" rx="70" ry="8" fill="#FF914D" stroke="#111" stroke-width="3"/>
  
  <!-- Pot decoration -->
  <path d="M145 410 Q200 400, 255 410" stroke="#FFD43B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M148 430 Q200 420, 252 430" stroke="#FFD43B" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Main stem -->
  <path d="M200 370 Q195 300, 200 220 Q205 160, 200 120" stroke="#5BCB77" stroke-width="5" fill="none"/>
  
  <!-- Leaves -->
  <path d="M200 300 Q160 270, 130 290 Q160 280, 200 300Z" fill="#5BCB77" stroke="#111" stroke-width="2.5"/>
  <path d="M200 250 Q240 220, 270 240 Q240 230, 200 250Z" fill="#5BCB77" stroke="#111" stroke-width="2.5"/>
  <path d="M200 200 Q160 170, 140 190 Q160 180, 200 200Z" fill="#5BCB77" stroke="#111" stroke-width="2.5"/>
  
  <!-- Flower -->
  <circle cx="200" cy="115" r="15" fill="#FFD43B" stroke="#111" stroke-width="3"/>
  <ellipse cx="180" cy="100" rx="12" ry="16" fill="#FF72B6" stroke="#111" stroke-width="2" transform="rotate(-30, 180, 100)"/>
  <ellipse cx="220" cy="100" rx="12" ry="16" fill="#FF72B6" stroke="#111" stroke-width="2" transform="rotate(30, 220, 100)"/>
  <ellipse cx="200" cy="85" rx="12" ry="16" fill="#FF72B6" stroke="#111" stroke-width="2"/>
  <ellipse cx="185" cy="120" rx="12" ry="16" fill="#FF72B6" stroke="#111" stroke-width="2" transform="rotate(-60, 185, 120)"/>
  <ellipse cx="215" cy="120" rx="12" ry="16" fill="#FF72B6" stroke="#111" stroke-width="2" transform="rotate(60, 215, 120)"/>
  <!-- Smiley face on flower center -->
  <circle cx="195" cy="112" r="2" fill="#111"/>
  <circle cx="205" cy="112" r="2" fill="#111"/>
  <path d="M195 119 Q200 123 205 119" stroke="#111" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Small butterfly -->
  <ellipse cx="300" cy="200" rx="12" ry="8" fill="#9B72FF" stroke="#111" stroke-width="2" transform="rotate(-20, 300, 200)"/>
  <ellipse cx="315" cy="195" rx="12" ry="8" fill="#4D7CFE" stroke="#111" stroke-width="2" transform="rotate(20, 315, 195)"/>
  <line x1="305" y1="200" x2="310" y2="195" stroke="#111" stroke-width="2"/>
  
  <!-- Sparkles -->
  <path d="M70 150 L75 165 L90 165 L78 175 L82 190 L70 182 L58 190 L62 175 L50 165 L65 165Z" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <path d="M340 300 L343 308 L351 308 L345 313 L347 321 L340 316 L333 321 L335 313 L329 308 L337 308Z" fill="#FF72B6" stroke="#111" stroke-width="2"/>
  
  <!-- Watering can hint -->
  <circle cx="80" cy="320" r="6" fill="#4D7CFE" opacity="0.5"/>
  <circle cx="90" cy="335" r="4" fill="#4D7CFE" opacity="0.4"/>
  <circle cx="85" cy="350" r="3" fill="#4D7CFE" opacity="0.3"/>
</svg>
