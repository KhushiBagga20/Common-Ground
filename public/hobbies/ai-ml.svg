<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" fill="none">
  <rect width="400" height="533" rx="20" fill="#F7F6F2"/>
  
  <!-- Robot head -->
  <rect x="120" y="140" width="160" height="140" rx="20" fill="#4D7CFE" stroke="#111" stroke-width="5"/>
  
  <!-- Antenna -->
  <line x1="200" y1="140" x2="200" y2="100" stroke="#111" stroke-width="4"/>
  <circle cx="200" cy="92" r="12" fill="#FFD43B" stroke="#111" stroke-width="3"/>
  
  <!-- Eyes -->
  <circle cx="165" cy="195" r="20" fill="#FFFFFF" stroke="#111" stroke-width="3"/>
  <circle cx="235" cy="195" r="20" fill="#FFFFFF" stroke="#111" stroke-width="3"/>
  <circle cx="170" cy="192" r="8" fill="#111"/>
  <circle cx="240" cy="192" r="8" fill="#111"/>
  <circle cx="173" cy="189" r="3" fill="#FFFFFF"/>
  <circle cx="243" cy="189" r="3" fill="#FFFFFF"/>
  
  <!-- Mouth - LED style -->
  <rect x="155" y="240" width="12" height="12" rx="2" fill="#5BCB77" stroke="#111" stroke-width="2"/>
  <rect x="172" y="240" width="12" height="12" rx="2" fill="#5BCB77" stroke="#111" stroke-width="2"/>
  <rect x="189" y="240" width="12" height="12" rx="2" fill="#5BCB77" stroke="#111" stroke-width="2"/>
  <rect x="206" y="240" width="12" height="12" rx="2" fill="#5BCB77" stroke="#111" stroke-width="2"/>
  <rect x="223" y="240" width="12" height="12" rx="2" fill="#5BCB77" stroke="#111" stroke-width="2"/>
  
  <!-- Body -->
  <rect x="140" y="290" width="120" height="100" rx="14" fill="#4D7CFE" stroke="#111" stroke-width="4"/>
  
  <!-- Chest details -->
  <circle cx="175" cy="330" r="12" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <circle cx="225" cy="330" r="12" fill="#FF5C5C" stroke="#111" stroke-width="2"/>
  <rect x="170" y="355" width="60" height="8" rx="4" fill="#111" opacity="0.3"/>
  
  <!-- Arms -->
  <rect x="85" y="300" width="50" height="18" rx="8" fill="#4D7CFE" stroke="#111" stroke-width="3"/>
  <circle cx="80" cy="309" r="12" fill="#FFD43B" stroke="#111" stroke-width="3"/>
  <rect x="265" y="300" width="50" height="18" rx="8" fill="#4D7CFE" stroke="#111" stroke-width="3"/>
  <circle cx="320" cy="309" r="12" fill="#FFD43B" stroke="#111" stroke-width="3"/>
  
  <!-- Binary code floating -->
  <text x="80" y="160" font-family="monospace" font-size="14" fill="#111" opacity="0.3">01</text>
  <text x="300" y="140" font-family="monospace" font-size="14" fill="#111" opacity="0.3">10</text>
  <text x="60" y="250" font-family="monospace" font-size="12" fill="#111" opacity="0.2">110</text>
  <text x="320" y="270" font-family="monospace" font-size="12" fill="#111" opacity="0.2">001</text>
  
  <!-- Neural network nodes -->
  <circle cx="100" cy="430" r="8" fill="#9B72FF" stroke="#111" stroke-width="2"/>
  <circle cx="160" cy="450" r="8" fill="#9B72FF" stroke="#111" stroke-width="2"/>
  <circle cx="240" cy="450" r="8" fill="#9B72FF" stroke="#111" stroke-width="2"/>
  <circle cx="300" cy="430" r="8" fill="#9B72FF" stroke="#111" stroke-width="2"/>
  <circle cx="200" cy="480" r="8" fill="#FF72B6" stroke="#111" stroke-width="2"/>
  <line x1="100" y1="430" x2="160" y2="450" stroke="#111" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="430" x2="240" y2="450" stroke="#111" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="430" x2="240" y2="450" stroke="#111" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="430" x2="160" y2="450" stroke="#111" stroke-width="1.5" opacity="0.3"/>
  <line x1="160" y1="450" x2="200" y2="480" stroke="#111" stroke-width="1.5" opacity="0.3"/>
  <line x1="240" y1="450" x2="200" y2="480" stroke="#111" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Sparkles -->
  <path d="M70 100 L75 115 L90 115 L78 125 L82 140 L70 132 L58 140 L62 125 L50 115 L65 115Z" fill="#FFD43B" stroke="#111" stroke-width="2"/>
  <path d="M340 380 L343 388 L351 388 L345 393 L347 401 L340 396 L333 401 L335 393 L329 388 L337 388Z" fill="#FF72B6" stroke="#111" stroke-width="2"/>
</svg>
